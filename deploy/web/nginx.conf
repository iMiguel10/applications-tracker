# Nginx de producción (F7, decisión 0023). Detrás del proxy de Coolify, que pone el
# HTTPS: aquí se sirve el frontend y el manual ya compilados y se reparte /api y
# /auth a la API. Sin puertos publicados en el host: solo lo alcanza el proxy.

# --- IP real del cliente -------------------------------------------------------
# La conexión llega siempre del proxy de Coolify (y de lo que haya delante, como un
# túnel). Nginx solo es alcanzable desde redes de Docker, así que se fía de las
# redes privadas y toma la IP del cliente de X-Forwarded-For, de derecha a
# izquierda (real_ip_recursive): lo de la izquierda lo puede escribir el cliente.
# Sin esto, limit_req contaría a todos los usuarios como una sola IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Rate limiting de la primera capa (límites y abuso §2) ----------------------
# Más generoso que el de la aplicación: aquí se para el abuso masivo; los límites
# por email, por usuario y por ruta los pone la API, que entiende la petición.
# /auth incluye también el refresco de la sesión y la consulta de la verificación
# del email, que hace la propia interfaz: por eso 60/min y no menos.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
limit_req_status 429;

# --- Cabeceras según la ruta ----------------------------------------------------
# Un valor vacío no añade la cabecera: lo que responde la API (y su Swagger, que
# carga sus ficheros de un CDN) sale con las cabeceras de la API.
map $uri $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    # Docusaurus aplica el tema con un script en línea antes de pintar.
    ~^/manual/ "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/(api|auth|docs|openapi\.json) "";
}

# Los ficheros con hash en el nombre no cambian nunca; index.html y el resto, sí.
map $uri $cache_control {
    default "no-cache";
    ~^/(manual/)?assets/ "public, max-age=31536000, immutable";
    ~^/(api|auth|docs|openapi\.json) "";
}

# El esquema original lo trae el proxy de Coolify (https); sin él, el de esta conexión.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/html;
    server_tokens off;
    # Las redirecciones (/manual → /manual/) relativas: absolutas saldrían con
    # http:// y el puerto interno, porque Nginx no ve el HTTPS del proxy.
    absolute_redirect off;

    # La API corta cada subida en su máximo exacto (DOCUMENT_MAX_BYTES, 5 MB por
    # defecto) y responde con su propio error; esto solo frena cuerpos absurdos.
    client_max_body_size 25m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Content-Security-Policy $csp always;
    # Sin "always": solo en las respuestas correctas. Un 404 bajo /assets/ con
    # "immutable" quedaría cacheado un año en un CDN o en el navegador.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # El DNS de Docker, con caché corta: la API cambia de IP en cada despliegue y con
    # proxy_pass fijo Nginx seguiría llamando a la antigua (502) hasta reiniciarse.
    # Con una variable, además, Nginx arranca aunque la API aún no exista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # El 429 de limit_req, con el mismo formato que el de la API ({detail, code,
    # retry_after} y Retry-After): sin esto sería una página HTML que la interfaz
    # solo podría mostrar como un error genérico. Las zonas se rellenan a una
    # petición por segundo, así que basta con esperar uno. Los 429 que responde la
    # propia API pasan tal cual: error_page no los intercepta.
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        # Un add_header aquí anula los del server: se repiten los de seguridad.
        add_header Retry-After 1 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"detail":"Too many requests","code":"rate_limited","retry_after":1}';
    }

    # Sin favicon.ico propio (el icono es /brand/logo.png): un 404, no el
    # index.html del SPA con un 200.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SuperTokens: inicio de sesión, registro, refresco, recuperación, verificación.
    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $api;
    }

    location /api/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $api;
    }

    # Swagger de la propia API (manual: API › Guía).
    location = /docs {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $api;
    }

    location = /openapi.json {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $api;
    }

    # Sin esto, /manual (sin barra) caería en el SPA y React Router pintaría su 404.
    location = /manual {
        return 301 /manual/;
    }

    # El manual (Docusaurus): cada página es una carpeta con su index.html. Se pide
    # el index.html explícito y no "$uri/": una carpeta sin página (una categoría)
    # daría 403 en lugar del 404 del manual.
    location /manual/ {
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /manual/404.html;
    }

    # El manual en inglés, con su propia página 404 (si no, saldría la española).
    location /manual/en/ {
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /manual/en/404.html;
    }

    # Un fichero con hash que no existe es un 404, no el index.html del SPA (que el
    # navegador intentaría ejecutar como JavaScript).
    location /assets/ {
        try_files $uri =404;
    }

    # El SPA: cualquier otra ruta la resuelve React Router.
    location / {
        try_files $uri /index.html;
    }
}
