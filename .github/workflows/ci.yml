name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend · lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run mypy app tests evals
        working-directory: backend

  backend-tests:
    name: Backend · pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.test.example .env.test
      - run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from api-test
      - if: always()
        run: docker compose -f compose.test.yml down -v

  frontend:
    name: Frontend · lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    # npm run test/build corren fuera de Docker: aquí no hay compose.yml que
    # inyecte VITE_API_URL desde .env, así que apiClient.ts (que exige la
    # variable) rompería toda importación suya. El valor es el de .env.example;
    # no se llama a una API real en las pruebas ni en el build.
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc -b
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docs:
    name: Documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm docs build --strict

  # Documentación de producción (Docusaurus, es + en). Nativo con Node, como el
  # frontend: el build genera la referencia de la API desde
  # docs/referencia/openapi.json y falla ante enlaces rotos.
  manual:
    name: Manual · traducciones, build y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: manual/package-lock.json
      - run: npm ci
        working-directory: manual
      - run: npm run check-i18n
        working-directory: manual
      - run: npm run build
        working-directory: manual
      # Después del build: sidebars.ts importa la referencia que genera.
      - run: npm run typecheck
        working-directory: manual

  # Las imágenes de producción (F7, deploy/): que construyen y que la configuración
  # de Nginx es válida. No despliega nada; el despliegue lo hace Coolify.
  prod-images:
    name: Producción · imágenes y Nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t applications-tracker-api:prod backend
      - run: docker build -f deploy/web/Dockerfile --build-arg APP_URL=https://ci.example.com -t applications-tracker-web:prod .
      # nginx -t resuelve el upstream al cargar si no fuera una variable; con la
      # variable de nginx.conf basta con la imagen sola.
      - run: docker run --rm applications-tracker-web:prod nginx -t
      - run: docker build -f deploy/backup/Dockerfile -t applications-tracker-backup:prod .
      # Los scripts de copia y restauración, sin errores de sintaxis de sh.
      - run: docker run --rm --entrypoint sh applications-tracker-backup:prod -c "sh -n /usr/local/bin/backup && sh -n /usr/local/bin/restore && sh -n /usr/local/bin/backup-healthcheck && sh -n /usr/local/bin/backup-entrypoint"
      # compose.prod.yml bien formado con todas sus obligatorias (valores de mentira).
      - run: docker compose -f compose.prod.yml config --quiet
        env:
          APP_URL: https://ci.example.com
          POSTGRES_PASSWORD: ci
          SUPERTOKENS_DB_PASSWORD: ci
          SUPERTOKENS_API_KEY: ci-supertokens-api-key
          APP_SECRET: ci-app-secret-0123456789abcdef0123456789
