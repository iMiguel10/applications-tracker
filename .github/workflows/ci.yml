name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend · lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run mypy app tests
        working-directory: backend

  backend-tests:
    name: Backend · pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.test.example .env.test
      - run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from api-test
      - if: always()
        run: docker compose -f compose.test.yml down -v

  frontend:
    name: Frontend · lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    # npm run test/build corren fuera de Docker: aquí no hay compose.yml que
    # inyecte VITE_API_URL desde .env, así que apiClient.ts (que exige la
    # variable) rompería toda importación suya. El valor es el de .env.example;
    # no se llama a una API real en las pruebas ni en el build.
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc -b
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docs:
    name: Documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm docs build --strict
