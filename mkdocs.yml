site_name: Applications Tracker
site_description: Documentación del sistema de seguimiento de solicitudes de empleo
docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - Producto:
      - Especificación: producto/especificacion.md
  - Arquitectura:
      - arquitectura/index.md
      - Servicios y estructura: arquitectura/servicios-y-estructura.md
      - Autenticación: arquitectura/autenticacion.md
  - Guías:
      - Documentar y usar la API: guias/documentar-la-api.md
  - Referencia:
      - API: referencia/api.md
  - Decisiones:
      - decisiones/index.md
      - "0001 — clock_timestamp en created_at": decisiones/0001-clock-timestamp-en-created-at.md
      - "0002 — Access token de 5 minutos": decisiones/0002-access-token-de-5-minutos.md
      - "0003 — Cookie y Bearer": decisiones/0003-autenticacion-por-cookie-y-bearer.md
      - "0004 — Secuencia en el historial": decisiones/0004-secuencia-para-ordenar-el-historial.md
      - "0005 — Recordatorios sin página global en F4": decisiones/0005-recordatorios-sin-pagina-global-en-f4.md
      - "0006 — CI antes que F5": decisiones/0006-ci-antes-que-f5.md
