# Solo para probar la producción en local, sin Coolify ni HTTPS (F7):
#
#   docker compose -p at-prod --env-file .env.prod.local -f compose.prod.yml -f compose.prod.local.yml up -d --build
#   docker compose -p at-prod down -v      # al terminar (borra sus volúmenes)
#
# Con APP_URL=http://localhost:8088 en .env.prod.local. `-p at-prod` lo separa del
# proyecto de desarrollo: otros contenedores, otros volúmenes. Publica la web en el
# 8088 de localhost, como haría el proxy de Coolify con el dominio.
services:
  web:
    ports:
      - "127.0.0.1:8088:80"
