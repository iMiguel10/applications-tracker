services:
  db:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BD exclusiva del core de SuperTokens (decisión A11). Sin env_file: con el .env
  # completo tomaría POSTGRES_DB/USER de la app y crearía la misma base de datos.
  supertokens-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${SUPERTOKENS_DB_NAME}
      POSTGRES_USER: ${SUPERTOKENS_DB_USER}
      POSTGRES_PASSWORD: ${SUPERTOKENS_DB_PASSWORD}
    volumes:
      - supertokens_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Core de autenticación. Sin puertos publicados: solo `api` habla con él por la
  # red interna. Versión fijada: debe implementar la CDI que usa supertokens-python.
  supertokens:
    image: supertokens/supertokens-postgresql:12.2.0
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${SUPERTOKENS_DB_USER}:${SUPERTOKENS_DB_PASSWORD}@supertokens-db:5432/${SUPERTOKENS_DB_NAME}
      API_KEYS: ${SUPERTOKENS_API_KEY}
      # Access token de 5 min: se valida sin consultar al core, así que tras un logout
      # seguiría sirviendo hasta caducar. 5 min acota esa ventana; el SDK del frontend
      # lo refresca solo (decisión 0002).
      ACCESS_TOKEN_VALIDITY: 300
    depends_on:
      supertokens-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e \"GET /hello HTTP/1.1\r\nhost: 127.0.0.1\r\nConnection: close\r\n\r\n\" >&3 && cat <&3 | grep Hello'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    # El entrypoint aplica las migraciones pendientes antes de arrancar uvicorn.
    entrypoint: ["/app/entrypoint.sh"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - api_venv:/app/.venv
      # Destino de app.scripts.export_openapi (referencia de la API del sitio).
      - ./docs/referencia:/reference
      # Almacén de ficheros (A21), compartido con worker.
      - files_data:/data/files
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Cola de trabajos (SAQ) y, desde F11, contadores de rate limit (A18, A28). Sin
  # puertos publicados, como el core de SuperTokens. appendonly: reiniciar el
  # contenedor no pierde los trabajos encolados.
  valkey:
    image: valkey/valkey:9.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Misma imagen, código, .venv y .env que api, con otro comando (servicios §8.1).
  # NO usa entrypoint.sh: las migraciones las aplica solo api. SAQ no recarga el
  # código, así que watchfiles reinicia el worker al cambiar cualquier .py de app/.
  # --quiet: que SAQ no configure el logging (lo hace a nivel WARNING y antes de
  # importar app.worker); así se aplica el de la app, igual que en api.
  worker:
    build:
      context: ./backend
    command: watchfiles --filter python "saq --quiet app.worker.settings" app
    volumes:
      - ./backend:/app
      - api_venv:/app/.venv
      - files_data:/data/files
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Solo desarrollo: captura todo el correo (SMTP interno en mailpit:1025) y no
  # envía nada fuera. Interfaz web en http://localhost:8025. En producción no hay
  # servicio de correo: el SMTP lo configura quien despliega (RNF-34).
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "8025:8025"

  docs:
    image: squidfunk/mkdocs-material:9
    command: serve --dev-addr 0.0.0.0:8000 --livereload
    ports:
      - "8001:8000"
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./docs:/docs/docs:ro

  # Documentación de PRODUCCIÓN (Docusaurus, es + en; decisión 0010), en
  # http://localhost:3001. La referencia de la API se genera al arrancar desde
  # docs/referencia/openapi.json, montado en la misma ruta relativa que en el host.
  # El servidor de desarrollo sirve un solo idioma: ver manual/README.md.
  manual:
    build:
      context: ./manual
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - ./manual:/app
      - /app/node_modules
      - ./docs/referencia:/docs/referencia:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Solo las variables VITE_* necesarias: el resto del .env no debe llegar al contenedor del frontend.
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - api

volumes:
  api_venv:
  files_data:
  postgres_data:
  supertokens_data:
  valkey_data:
